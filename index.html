<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wavetable Viewer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #15171c;
    --panel: #1c1f27;
    --border: #2c303a;
    --text: #e4e6eb;
    --dim: #8b91a0;
    --accent: #5fd3c4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
  header .status { color: var(--dim); font-size: 12px; }
  header button {
    background: var(--accent); color: #0a1210; border: none;
    padding: 7px 14px; border-radius: 6px; font-weight: 600; cursor: pointer;
    font-size: 12px;
  }
  header button:hover { filter: brightness(1.1); }
  header .repoLink { margin-left: auto; color: var(--dim); text-decoration: none; font-size: 12px; }
  header .repoLink:hover { color: var(--text); }

  main { flex: 1; display: flex; min-height: 0; }

  #sidebar {
    width: 260px; flex: none;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    background: var(--panel);
  }
  #filter {
    margin: 10px; padding: 7px 9px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px;
  }
  #filter:focus { outline: 1px solid var(--accent); }
  #fileList { list-style: none; margin: 0; padding: 0 6px 10px; overflow-y: auto; flex: 1; }
  #fileList li {
    padding: 6px 8px; border-radius: 5px; cursor: pointer;
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 12px;
  }
  #fileList li:hover { background: #262a34; color: var(--text); }
  #fileList li.active { background: var(--accent); color: #0a1210; font-weight: 600; }

  #content { flex: 1; overflow-y: auto; padding: 16px; }
  #emptyState {
    color: var(--dim); text-align: center; margin-top: 80px; font-size: 13px;
  }
  #wavTitle { margin: 0 0 3px; font-size: 15px; }
  #wavMeta { color: var(--dim); margin: 0 0 16px; font-size: 12px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 6px;
  }
  .cell {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px; cursor: pointer; user-select: none;
  }
  .cell:hover { border-color: var(--accent); }
  .cell.playing { border-color: var(--accent); background: #20342f; }
  .cell.selected { outline: 2px solid #7c8797; outline-offset: 1px; }
  .cell canvas { display: block; width: 100%; height: 48px; }
  .cell .idx { color: var(--dim); font-size: 10px; text-align: center; margin-top: 2px; }

  #preview {
    position: sticky; top: 0; margin-bottom: 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; display: flex; align-items: center; gap: 16px;
  }
  #preview canvas { background: var(--bg); border-radius: 4px; }
  #preview .label { color: var(--dim); font-size: 12px; }
  #preview .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }

  .transport { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .transport button {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .transport button:hover { border-color: var(--accent); }
  .transport button.active { background: var(--accent); color: #0a1210; border-color: var(--accent); font-weight: 600; }
  .transport .speed { display: flex; align-items: center; gap: 6px; margin-left: 8px; color: var(--dim); font-size: 12px; }
  .transport .speed input[type="range"] { accent-color: var(--accent); width: 110px; }
  .transport .speed .speedValue { width: 60px; color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>Wavetable Viewer</h1>
  <button id="pickBtn">Choose a different folder…</button>
  <span class="status" id="status">Loading bundled samples…</span>
  <a class="repoLink" href="https://github.com/todbot/wavetable_viewer"
     target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
</header>

<main>
  <div id="sidebar">
    <input id="filter" type="text" placeholder="Filter files…" disabled>
    <ul id="fileList"></ul>
  </div>
  <div id="content">
    <div id="emptyState">Select a WAV file from the list to view its waveforms.</div>
  </div>
</main>

<script>
const pickBtn = document.getElementById('pickBtn');
const status = document.getElementById('status');
const filterInput = document.getElementById('filter');
const fileListEl = document.getElementById('fileList');
const content = document.getElementById('content');

const FRAME_SAMPLES = 256; // samples per single-cycle waveform

let files = [];        // { name, load: () => Promise<ArrayBuffer> }
let currentName = null;
let audioCtx = null;
let activeSource = null;
let activeCell = null;

let currentFrames = [];   // Int16Array per waveform, for the currently displayed WAV
let currentCells = [];    // grid cell elements, parallel to currentFrames
let selectedIndex = -1;
let previewCanvasEl = null;
let previewLabelEl = null;

let scanTimer = null;
let scanDirection = 0;   // 1 = forward, -1 = backward, 0 = stopped
let scanMode = 'once';   // 'once' | 'loop' | 'bounce' — what happens at the ends
let scanIntervalMs = 110; // adjustable time per waveform, persists across file switches
let btnForwardEl = null, btnBackwardEl = null, btnLoopEl = null, btnBounceEl = null;
let speedInputEl = null, speedValueEl = null;

const DEFAULT_DIR = 'samples/';

loadDefaultSamples();

async function loadDefaultSamples() {
  try {
    const res = await fetch(DEFAULT_DIR + 'manifest.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const names = await res.json();
    files = names.map(name => ({
      name,
      load: async () => (await fetch(DEFAULT_DIR + name)).arrayBuffer(),
    }));
    renderFileList();
    status.textContent = `${files.length} bundled WAV file${files.length === 1 ? '' : 's'}`;
    filterInput.disabled = files.length === 0;
  } catch (err) {
    status.textContent = 'Bundled samples unavailable (serve over http:// to auto-load, or choose a folder)';
    return;
  }

  const shared = parseHash();
  if (shared && shared.file) {
    const match = files.find(f => f.name === shared.file);
    if (match) {
      scanMode = shared.mode;
      scanIntervalMs = shared.speed;
      await selectFile(match);
      showFrame(shared.frame);
      if (shared.dir !== 0) startScan(shared.dir);
    }
  }
}

// Playback can't start until a user gesture unlocks the AudioContext, so a
// shared link with playback enabled resumes as soon as the visitor clicks
// or presses any key anywhere on the page.
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);
function unlockAudio() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function parseHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return null;
  const params = new URLSearchParams(raw);
  const file = params.get('file');
  if (!file) return null;
  const frame = parseInt(params.get('frame'), 10);
  const dir = parseInt(params.get('dir'), 10);
  const mode = params.get('mode');
  const speed = parseInt(params.get('speed'), 10);
  return {
    file,
    frame: Number.isFinite(frame) ? frame : 0,
    dir: (dir === 1 || dir === -1) ? dir : 0,
    mode: (mode === 'loop' || mode === 'bounce') ? mode : 'once',
    speed: Number.isFinite(speed) ? speed : scanIntervalMs,
  };
}

function updateHash() {
  if (!currentName || selectedIndex < 0) return;
  const params = new URLSearchParams();
  params.set('file', currentName);
  params.set('frame', String(selectedIndex));
  if (scanDirection !== 0) params.set('dir', String(scanDirection));
  if (scanMode !== 'once') params.set('mode', scanMode);
  if (scanIntervalMs !== 110) params.set('speed', String(scanIntervalMs));
  history.replaceState(null, '', '#' + params.toString());
}

pickBtn.addEventListener('click', async () => {
  try {
    let picked = [];
    if (window.showDirectoryPicker) {
      const dirHandle = await window.showDirectoryPicker();
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file' && /\.wav$/i.test(name)) {
          const file = await handle.getFile();
          picked.push({ name, load: () => file.arrayBuffer() });
        }
      }
    } else {
      // Fallback: <input webkitdirectory>
      picked = await pickWithInput();
    }
    picked.sort((a, b) => a.name.localeCompare(b.name));
    files = picked;
    currentName = null;
    renderFileList();
    status.textContent = `${files.length} WAV file${files.length === 1 ? '' : 's'} loaded`;
    filterInput.disabled = files.length === 0;
  } catch (err) {
    if (err.name !== 'AbortError') console.error(err);
  }
});

function pickWithInput() {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.webkitdirectory = true;
    input.multiple = true;
    input.addEventListener('change', () => {
      const picked = Array.from(input.files)
        .filter(f => /\.wav$/i.test(f.name))
        .map(f => ({ name: f.name, load: () => f.arrayBuffer() }));
      resolve(picked);
    });
    input.click();
  });
}

filterInput.addEventListener('input', renderFileList);

function renderFileList() {
  const q = filterInput.value.trim().toLowerCase();
  fileListEl.innerHTML = '';
  for (const f of files) {
    if (q && !f.name.toLowerCase().includes(q)) continue;
    const li = document.createElement('li');
    li.textContent = f.name;
    if (f.name === currentName) li.classList.add('active');
    li.addEventListener('click', () => selectFile(f));
    fileListEl.appendChild(li);
  }
}

async function selectFile(f) {
  currentName = f.name;
  renderFileList();
  stopPlayback();

  const buf = await f.load();
  let wav;
  try {
    wav = parseWav(buf);
  } catch (err) {
    content.innerHTML = `<div id="emptyState">Could not parse ${f.name}: ${err.message}</div>`;
    return;
  }

  const frameCount = Math.floor(wav.samples.length / FRAME_SAMPLES);

  content.innerHTML = '';

  const title = document.createElement('h2');
  title.id = 'wavTitle';
  title.textContent = f.name;
  content.appendChild(title);

  const meta = document.createElement('p');
  meta.id = 'wavMeta';
  meta.textContent = `${wav.sampleRate} Hz · ${wav.bitsPerSample}-bit · ${wav.numChannels}ch · ` +
    `${wav.samples.length} samples · ${frameCount} waveforms × ${FRAME_SAMPLES} samples`;
  content.appendChild(meta);

  const preview = document.createElement('div');
  preview.id = 'preview';
  const previewCanvas = document.createElement('canvas');
  previewCanvas.width = 400;
  previewCanvas.height = 140;
  const previewLabel = document.createElement('div');
  previewLabel.innerHTML = `<div class="label" id="previewLabel">Click a waveform to inspect &amp; loop it</div>
    <div class="hint">Click again to stop &middot; arrow keys to move &middot; space to play</div>
    <div class="transport">
      <button id="btnBackward" title="Play backward through the wavetable">◀ Backward</button>
      <button id="btnForward" title="Play forward through the wavetable">Forward ▶</button>
      <button id="btnLoop" title="Wrap around at the ends">⟲ Loop</button>
      <button id="btnBounce" title="Reverse direction at the ends">⇄ Bounce</button>
      <label class="speed">Speed
        <input id="speedInput" type="range" min="20" max="500" step="10">
        <span class="speedValue" id="speedValue"></span>
      </label>
    </div>`;
  preview.appendChild(previewCanvas);
  preview.appendChild(previewLabel);
  content.appendChild(preview);
  drawWave(previewCanvas, wav.samples.subarray(0, FRAME_SAMPLES));
  previewCanvasEl = previewCanvas;
  previewLabelEl = document.getElementById('previewLabel');

  stopScan();
  btnForwardEl = document.getElementById('btnForward');
  btnBackwardEl = document.getElementById('btnBackward');
  btnLoopEl = document.getElementById('btnLoop');
  btnBounceEl = document.getElementById('btnBounce');
  btnForwardEl.addEventListener('click', () => scanDirection === 1 ? stopScan() : startScan(1));
  btnBackwardEl.addEventListener('click', () => scanDirection === -1 ? stopScan() : startScan(-1));
  btnLoopEl.addEventListener('click', () => {
    scanMode = scanMode === 'loop' ? 'once' : 'loop';
    updateTransportUI();
    updateHash();
  });
  btnBounceEl.addEventListener('click', () => {
    scanMode = scanMode === 'bounce' ? 'once' : 'bounce';
    updateTransportUI();
    updateHash();
  });
  speedInputEl = document.getElementById('speedInput');
  speedValueEl = document.getElementById('speedValue');
  speedInputEl.value = scanIntervalMs;
  speedInputEl.addEventListener('input', () => {
    scanIntervalMs = Number(speedInputEl.value);
    updateTransportUI();
    updateHash();
    if (scanTimer) {
      clearInterval(scanTimer);
      scanTimer = setInterval(stepScan, scanIntervalMs);
    }
  });
  updateTransportUI();

  const grid = document.createElement('div');
  grid.id = 'grid';
  content.appendChild(grid);

  currentFrames = [];
  currentCells = [];
  selectedIndex = -1;

  for (let i = 0; i < frameCount; i++) {
    const frame = wav.samples.subarray(i * FRAME_SAMPLES, (i + 1) * FRAME_SAMPLES);

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.tabIndex = -1;

    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 48;
    drawWave(canvas, frame);
    cell.appendChild(canvas);

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = i;
    cell.appendChild(idx);

    cell.addEventListener('click', () => {
      const wasActive = cell === activeCell;
      stopScan();
      showFrame(i);
      if (!wasActive) playFrame(frame, cell);
    });

    grid.appendChild(cell);
    currentFrames.push(frame);
    currentCells.push(cell);
  }

  showFrame(0);
}

function showFrame(i) {
  if (i < 0 || i >= currentFrames.length) return;
  selectedIndex = i;
  previewLabelEl.textContent = `Waveform #${i}`;
  drawWave(previewCanvasEl, currentFrames[i], true);
  for (const c of currentCells) c.classList.remove('selected');
  currentCells[i].classList.add('selected');
  currentCells[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  updateHash();
}

function gridColumnCount() {
  if (currentCells.length === 0) return 1;
  const firstTop = currentCells[0].offsetTop;
  for (let i = 1; i < currentCells.length; i++) {
    if (currentCells[i].offsetTop !== firstTop) return i;
  }
  return currentCells.length;
}

document.addEventListener('keydown', (e) => {
  if (currentFrames.length === 0) return;
  if (document.activeElement === filterInput) return;

  if (e.key === ' ' || e.key === 'Enter') {
    if (selectedIndex < 0) return;
    e.preventDefault();
    const cell = currentCells[selectedIndex];
    const wasActive = cell === activeCell;
    stopScan();
    if (!wasActive) playFrame(currentFrames[selectedIndex], cell);
    return;
  }

  const cols = gridColumnCount();
  const from = selectedIndex < 0 ? 0 : selectedIndex;
  let next;
  switch (e.key) {
    case 'ArrowRight': next = Math.min(currentFrames.length - 1, from + 1); break;
    case 'ArrowLeft':  next = Math.max(0, from - 1); break;
    case 'ArrowDown':  next = Math.min(currentFrames.length - 1, from + cols); break;
    case 'ArrowUp':    next = Math.max(0, from - cols); break;
    default: return;
  }
  const wasPlaying = !!activeSource;
  e.preventDefault();
  stopScan();
  showFrame(next);
  if (wasPlaying) playFrame(currentFrames[next], currentCells[next]); // follow selection while playing
});

function startScan(direction) {
  if (currentFrames.length === 0) return;
  scanDirection = direction;
  if (selectedIndex < 0) showFrame(0);
  playFrame(currentFrames[selectedIndex], currentCells[selectedIndex]);
  if (scanTimer) clearInterval(scanTimer);
  scanTimer = setInterval(stepScan, scanIntervalMs);
  updateTransportUI();
  updateHash();
}

function stopScan() {
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  scanDirection = 0;
  stopPlayback();
  updateTransportUI();
  updateHash();
}

function stepScan() {
  const last = currentFrames.length - 1;
  let next = selectedIndex + scanDirection;
  if (next > last) {
    if (scanMode === 'loop') next = 0;
    else if (scanMode === 'bounce') { scanDirection = -1; next = Math.max(0, last - 1); }
    else { stopScan(); return; }
  } else if (next < 0) {
    if (scanMode === 'loop') next = last;
    else if (scanMode === 'bounce') { scanDirection = 1; next = Math.min(last, 1); }
    else { stopScan(); return; }
  }
  showFrame(next);
  playFrame(currentFrames[next], currentCells[next]);
  updateTransportUI();
}

function updateTransportUI() {
  if (!btnForwardEl) return;
  btnForwardEl.classList.toggle('active', scanDirection === 1);
  btnBackwardEl.classList.toggle('active', scanDirection === -1);
  btnLoopEl.classList.toggle('active', scanMode === 'loop');
  btnBounceEl.classList.toggle('active', scanMode === 'bounce');
  speedValueEl.textContent = `${scanIntervalMs} ms/frame`;
}

function drawWave(canvas, samples, thick) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#5fd3c4';
  ctx.lineWidth = thick ? 2 : 1;
  ctx.beginPath();
  const n = samples.length;
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * w;
    const y = h / 2 - (samples[i] / 32768) * (h / 2 - 2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function playFrame(frame, cell) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  stopPlayback();

  const buffer = audioCtx.createBuffer(1, frame.length, audioCtx.sampleRate);
  const chan = buffer.getChannelData(0);
  for (let i = 0; i < frame.length; i++) chan[i] = frame[i] / 32768;

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.3;
  src.connect(gain).connect(audioCtx.destination);
  src.start();

  activeSource = src;
  activeCell = cell;
  cell.classList.add('playing');
}

function stopPlayback() {
  if (activeSource) {
    try { activeSource.stop(); } catch (e) {}
    activeSource.disconnect();
    activeSource = null;
  }
  if (activeCell) {
    activeCell.classList.remove('playing');
    activeCell = null;
  }
}

// Minimal RIFF/WAVE parser -> { sampleRate, numChannels, bitsPerSample, samples: Int16Array }
function parseWav(arrayBuffer) {
  const dv = new DataView(arrayBuffer);
  if (dv.getUint32(0, false) !== 0x52494646 /* RIFF */ ||
      dv.getUint32(8, false) !== 0x57415645 /* WAVE */) {
    throw new Error('not a RIFF/WAVE file');
  }
  let offset = 12;
  let fmt = null, dataOffset = null, dataLength = null;
  while (offset + 8 <= dv.byteLength) {
    const id = String.fromCharCode(
      dv.getUint8(offset), dv.getUint8(offset + 1),
      dv.getUint8(offset + 2), dv.getUint8(offset + 3));
    const size = dv.getUint32(offset + 4, true);
    const body = offset + 8;
    if (id === 'fmt ') {
      fmt = {
        audioFormat: dv.getUint16(body, true),
        numChannels: dv.getUint16(body + 2, true),
        sampleRate: dv.getUint32(body + 4, true),
        bitsPerSample: dv.getUint16(body + 14, true),
      };
    } else if (id === 'data') {
      dataOffset = body;
      dataLength = size;
    }
    offset = body + size + (size % 2); // chunks are word-aligned
  }
  if (!fmt || dataOffset == null) throw new Error('missing fmt/data chunk');
  if (fmt.bitsPerSample !== 16) throw new Error(`unsupported bit depth ${fmt.bitsPerSample}`);

  const sampleCount = Math.floor(dataLength / 2);
  const samples = new Int16Array(arrayBuffer, dataOffset, sampleCount);

  return {
    sampleRate: fmt.sampleRate,
    numChannels: fmt.numChannels,
    bitsPerSample: fmt.bitsPerSample,
    samples,
  };
}
</script>
</body>
</html>
