<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wavetable Viewer</title>
<meta name="description" content="Browse and play every waveform inside classic single-cycle wavetable .WAV files, right in your browser.">

<meta property="og:type" content="website">

<meta name="twitter:image" content="https://todbot.github.io/wavetable_viewer/og-image.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #15171c;
    --panel: #1c1f27;
    --border: #2c303a;
    --text: #e4e6eb;
    --dim: #8b91a0;
    --accent: #5fd3c4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  header h1 { font-size: 19px; font-weight: 600; margin: 0; white-space: nowrap; }
  header h1 .titleLink { color: inherit; text-decoration: none; }
  header h1 .titleLink:hover { text-decoration: underline; }
  header .repoLink { margin-left: auto; color: var(--dim); text-decoration: none; font-size: 12px; }
  header .repoLink:hover { color: var(--text); }

  main { flex: 1; display: flex; min-height: 0; }

  #sidebar {
    width: 260px; flex: none;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    background: var(--panel);
  }
  #sidebar button {
    background: var(--accent); color: #0a1210; border: none;
    padding: 7px 14px; border-radius: 6px; font-weight: 600; cursor: pointer;
    font-size: 12px; margin: 10px 10px 0;
  }
  #sidebar button:hover { filter: brightness(1.1); }
  #sidebar .status { color: var(--dim); font-size: 11px; margin: 6px 10px 0; }
  #filter {
    margin: 10px; padding: 7px 9px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px;
  }
  #filter:focus { outline: 1px solid var(--accent); }
  #fileList { list-style: none; margin: 0; padding: 0 6px 10px; overflow-y: auto; flex: 1; }
  #fileList li {
    padding: 6px 8px; border-radius: 5px; cursor: pointer;
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 12px;
  }
  #fileList li:hover { background: #262a34; color: var(--text); }
  #fileList li.active { background: var(--accent); color: #0a1210; font-weight: 600; }

  #content { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  #emptyState {
    color: var(--dim); text-align: center; margin-top: 80px; font-size: 13px;
  }

  /* #content has no top padding — topPanel supplies its own, so its
     opaque background fully covers the scrollable area behind it with
     no exposed strip for grid cells to peek through while scrolling. */
  #topPanel {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding-top: 16px; padding-bottom: 14px;
  }
  .titleRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #wavTitle { margin: 0 0 3px; font-size: 15px; }
  #wavMeta { color: var(--dim); margin: 0 0 16px; font-size: 12px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 6px;
  }
  .cell {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px; cursor: pointer; user-select: none;
  }
  .cell:hover { border-color: var(--accent); }
  .cell.playing { border-color: var(--accent); background: #20342f; }
  .cell.selected { outline: 2px solid #7c8797; outline-offset: 1px; }
  .cell canvas { display: block; width: 100%; height: 48px; }
  .cell .idx { color: var(--dim); font-size: 10px; text-align: center; margin-top: 2px; }

  #preview {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; display: flex; align-items: flex-start; gap: 16px;
  }
  #preview canvas { background: var(--bg); border-radius: 4px; }
  #preview .previewBody { flex: 1; align-self: center; }
  #preview .label { color: var(--dim); font-size: 12px; }
  #preview .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }
  /* Share and the transport controls share one button look. */
  .shareBtn, .transport button {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .shareBtn:hover, .transport button:hover { border-color: var(--accent); }
  .shareBtn.active, .transport button.active {
    background: var(--accent); color: #0a1210; border-color: var(--accent); font-weight: 600;
  }
  .shareBtn { white-space: nowrap; flex: none; }

  .transport { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .transport .playLabel { color: var(--dim); font-size: 12px; margin-right: 2px; }
  .transport button.arrowBtn { font-size: 17px; padding: 3px 13px; line-height: 1.2; }
  .transport .speed { display: flex; align-items: center; gap: 6px; margin-left: 8px; color: var(--dim); font-size: 12px; }
  .transport .speed input[type="range"] { accent-color: var(--accent); width: 110px; }
  .transport .speed .speedValue { width: 60px; color: var(--text); }

  #soundHint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #0a1210;
    padding: 8px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 600;
    pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,.35);
    opacity: 0; transition: opacity .4s ease;
    z-index: 1000;
  }
  #soundHint.visible { opacity: 1; }
</style>
</head>
<body>

<div id="soundHint">🔊 Click for sound</div>

<header>
  <h1><a href="./" class="titleLink">Wavetable Viewer</a></h1>
  <a class="repoLink" href="https://github.com/todbot/wavetable_viewer"
     target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
</header>

<main>
  <div id="sidebar">
    <button id="pickBtn">Choose a different folder…</button>
    <span class="status" id="status">Loading bundled samples…</span>
    <input id="filter" type="text" placeholder="Filter files…" disabled>
    <ul id="fileList"></ul>
  </div>
  <div id="content">
    <div id="emptyState">Select a WAV file from the list to view its waveforms.</div>
  </div>
</main>

<script>
const pickBtn = document.getElementById('pickBtn');
const statusEl = document.getElementById('status');
const filterInput = document.getElementById('filter');
const fileListEl = document.getElementById('fileList');
const content = document.getElementById('content');
const soundHint = document.getElementById('soundHint');

const FRAME_SAMPLES = 256;     // samples per single-cycle waveform
const SAMPLE_SCALE = 32768;    // 16-bit PCM full scale
const DEFAULT_SPEED_MS = 110;  // scan speed omitted from the URL hash at this value

const plural = (n) => n === 1 ? '' : 's';

let files = [];        // { name, load: () => Promise<ArrayBuffer> }
let currentName = null;
let audioCtx = null;
let activeSource = null;
let activeCell = null;

let currentFrames = [];   // Int16Array per waveform, for the currently displayed WAV
let currentCells = [];    // grid cell elements, parallel to currentFrames
let selectedIndex = -1;
let previewCanvasEl = null;
let previewLabelEl = null;

let scanTimer = null;
let scanDirection = 0;   // 1 = forward, -1 = backward, 0 = stopped
let scanMode = 'once';   // 'once' | 'loop' | 'bounce' — what happens at the ends
let scanIntervalMs = DEFAULT_SPEED_MS; // adjustable per-waveform time, persists across file switches
let btnForwardEl = null, btnBackwardEl = null, btnStopEl = null, btnLoopEl = null, btnBounceEl = null;
let speedInputEl = null, speedValueEl = null;
let btnShareEl = null;
let shareResetTimer = null;

const DEFAULT_DIR = 'samples/';

loadDefaultSamples();

async function loadDefaultSamples() {
  try {
    const res = await fetch(DEFAULT_DIR + 'manifest.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const names = await res.json();
    files = names.map(name => ({
      name,
      load: async () => (await fetch(DEFAULT_DIR + name)).arrayBuffer(),
    }));
    refreshFiles(`${files.length} bundled WAV file${plural(files.length)}`);
  } catch {
    statusEl.textContent = 'Bundled samples unavailable (serve over http:// to auto-load, or choose a folder)';
    return;
  }

  const shared = parseHash();
  if (shared && shared.file) {
    const match = files.find(f => f.name === shared.file);
    if (match) {
      scanMode = shared.mode;
      scanIntervalMs = shared.speed;
      await selectFile(match);
      showFrame(shared.frame);
      if (shared.dir !== 0) {
        startScan(shared.dir);
        soundHint.classList.add('visible');
      }
    }
  }
}

// Playback can't start until a user gesture unlocks the AudioContext, so a
// shared link with playback enabled resumes as soon as the visitor clicks
// or presses any key anywhere on the page. The actual re-trigger of audio
// once unlocked lives in playFrame()'s onstatechange handler, not here —
// see the comment there for why.
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);
function unlockAudio() {
  soundHint.classList.remove('visible');
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function parseHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return null;
  const params = new URLSearchParams(raw);
  const file = params.get('file');
  if (!file) return null;
  const frame = parseInt(params.get('frame'), 10);
  const dir = parseInt(params.get('dir'), 10);
  const mode = params.get('mode');
  const speed = parseInt(params.get('speed'), 10);
  return {
    file,
    frame: Number.isFinite(frame) ? frame : 0,
    dir: (dir === 1 || dir === -1) ? dir : 0,
    mode: (mode === 'loop' || mode === 'bounce') ? mode : 'once',
    speed: Number.isFinite(speed) ? speed : scanIntervalMs,
  };
}

function updateHash() {
  if (!currentName || selectedIndex < 0) return;
  const params = new URLSearchParams();
  params.set('file', currentName);
  params.set('frame', String(selectedIndex));
  if (scanDirection !== 0) params.set('dir', String(scanDirection));
  if (scanMode !== 'once') params.set('mode', scanMode);
  if (scanIntervalMs !== DEFAULT_SPEED_MS) params.set('speed', String(scanIntervalMs));
  history.replaceState(null, '', '#' + params.toString());
}

function copyShareLink() {
  const url = location.href;
  const onCopied = () => {
    clearTimeout(shareResetTimer);
    btnShareEl.textContent = '✓ Copied';
    btnShareEl.classList.add('active');
    shareResetTimer = setTimeout(() => {
      btnShareEl.textContent = '⎘ Share';
      btnShareEl.classList.remove('active');
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(onCopied, () => fallbackCopy(url, onCopied));
  } else {
    fallbackCopy(url, onCopied);
  }
}

function fallbackCopy(text, onCopied) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); onCopied(); } catch { /* ignore */ }
  document.body.removeChild(ta);
}

pickBtn.addEventListener('click', async () => {
  try {
    let picked = [];
    if (window.showDirectoryPicker) {
      const dirHandle = await window.showDirectoryPicker();
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file' && /\.wav$/i.test(name)) {
          const file = await handle.getFile();
          picked.push({ name, load: () => file.arrayBuffer() });
        }
      }
    } else {
      // Fallback: <input webkitdirectory>
      picked = await pickWithInput();
    }
    picked.sort((a, b) => a.name.localeCompare(b.name));
    files = picked;
    currentName = null;
    refreshFiles(`${files.length} WAV file${plural(files.length)} loaded`);
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error(err);
      statusEl.textContent = `Couldn't open folder picker: ${err.message || err.name}`;
    }
  }
});

// Re-render the sidebar list after `files` changes, and report what's in it.
function refreshFiles(statusText) {
  renderFileList();
  statusEl.textContent = statusText;
  filterInput.disabled = files.length === 0;
}

function pickWithInput() {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.webkitdirectory = true;
    input.multiple = true;
    input.style.display = 'none';
    // Some browsers (Safari in particular) won't reliably open the native
    // picker for a detached <input>; it needs to actually be in the DOM.
    document.body.appendChild(input);
    input.addEventListener('change', () => {
      const picked = Array.from(input.files)
        .filter(f => /\.wav$/i.test(f.name))
        .map(f => ({ name: f.name, load: () => f.arrayBuffer() }));
      input.remove();
      resolve(picked);
    });
    input.click();
  });
}

filterInput.addEventListener('input', renderFileList);

function renderFileList() {
  const q = filterInput.value.trim().toLowerCase();
  fileListEl.innerHTML = '';
  for (const f of files) {
    if (q && !f.name.toLowerCase().includes(q)) continue;
    const li = document.createElement('li');
    li.textContent = f.name;
    if (f.name === currentName) li.classList.add('active');
    li.addEventListener('click', () => selectFile(f));
    fileListEl.appendChild(li);
  }
}

async function selectFile(f) {
  // Preserve playback state across the switch — captured before
  // stopPlayback()/stopScan() below reset it.
  const wasScanDirection = scanDirection;
  const wasPlaying = !!activeSource;

  currentName = f.name;
  renderFileList();
  stopPlayback();

  const buf = await f.load();
  let wav;
  try {
    wav = parseWav(buf);
  } catch (err) {
    content.innerHTML = `<div id="emptyState">Could not parse ${f.name}: ${err.message}</div>`;
    return;
  }

  const frameCount = Math.floor(wav.samples.length / FRAME_SAMPLES);

  content.innerHTML = '';

  // The top panel is static markup apart from two text fields, so it's one
  // template; the per-file text goes in via textContent below (never
  // interpolated, so a filename containing markup can't escape).
  const topPanel = document.createElement('div');
  topPanel.id = 'topPanel';
  topPanel.innerHTML = `<div class="titleRow">
      <h2 id="wavTitle"></h2>
      <button id="btnShare" class="shareBtn" title="Copy a link to this view to the clipboard">⎘ Share</button>
    </div>
    <p id="wavMeta"></p>
    <div id="preview">
      <canvas width="400" height="140"></canvas>
      <div class="previewBody">
        <div class="label" id="previewLabel">Click a waveform to inspect &amp; loop it</div>
        <div class="hint">Click again to stop &middot; arrow keys to move &middot; space to play</div>
        <div class="transport">
          <span class="playLabel">Play:</span>
          <button id="btnBackward" class="arrowBtn" title="Play backward through the wavetable" aria-label="Play backward">◀</button>
          <button id="btnStop" class="arrowBtn" title="Stop playback" aria-label="Stop">⏹</button>
          <button id="btnForward" class="arrowBtn" title="Play forward through the wavetable" aria-label="Play forward">▶</button>
          <button id="btnLoop" title="Wrap around at the ends">⟲ Loop</button>
          <button id="btnBounce" title="Reverse direction at the ends">⇄ Bounce</button>
          <label class="speed">Speed
            <input id="speedInput" type="range" min="20" max="500" step="10">
            <span class="speedValue" id="speedValue"></span>
          </label>
        </div>
      </div>
    </div>`;
  content.appendChild(topPanel);

  topPanel.querySelector('#wavTitle').textContent = f.name;
  topPanel.querySelector('#wavMeta').textContent =
    `${wav.sampleRate} Hz · ${wav.bitsPerSample}-bit · ${wav.numChannels}ch · ` +
    `${wav.samples.length} samples · ${frameCount} waveforms × ${FRAME_SAMPLES} samples`;

  previewCanvasEl = topPanel.querySelector('#preview canvas');
  previewLabelEl = topPanel.querySelector('#previewLabel');
  drawWave(previewCanvasEl, wav.samples.subarray(0, FRAME_SAMPLES));

  // Deliberately before the btn*El reassignments: stopScan() calls
  // updateTransportUI(), which should write to the outgoing file's
  // (now-detached) buttons, not the freshly built ones.
  stopScan();
  btnForwardEl = document.getElementById('btnForward');
  btnBackwardEl = document.getElementById('btnBackward');
  btnStopEl = document.getElementById('btnStop');
  btnLoopEl = document.getElementById('btnLoop');
  btnBounceEl = document.getElementById('btnBounce');
  btnForwardEl.addEventListener('click', () => scanDirection === 1 ? stopScan() : startScan(1));
  btnBackwardEl.addEventListener('click', () => scanDirection === -1 ? stopScan() : startScan(-1));
  btnStopEl.addEventListener('click', () => stopScan());
  btnLoopEl.addEventListener('click', () => {
    scanMode = scanMode === 'loop' ? 'once' : 'loop';
    updateTransportUI();
    updateHash();
  });
  btnBounceEl.addEventListener('click', () => {
    scanMode = scanMode === 'bounce' ? 'once' : 'bounce';
    updateTransportUI();
    updateHash();
  });
  speedInputEl = document.getElementById('speedInput');
  speedValueEl = document.getElementById('speedValue');
  speedInputEl.value = scanIntervalMs;
  speedInputEl.addEventListener('input', () => {
    scanIntervalMs = Number(speedInputEl.value);
    updateTransportUI();
    updateHash();
    if (scanTimer) {
      clearInterval(scanTimer);
      scanTimer = setInterval(stepScan, scanIntervalMs);
    }
  });
  btnShareEl = document.getElementById('btnShare');
  btnShareEl.addEventListener('click', copyShareLink);
  updateTransportUI();

  const grid = document.createElement('div');
  grid.id = 'grid';
  content.appendChild(grid);

  currentFrames = [];
  currentCells = [];
  selectedIndex = -1;

  for (let i = 0; i < frameCount; i++) {
    const frame = wav.samples.subarray(i * FRAME_SAMPLES, (i + 1) * FRAME_SAMPLES);

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.tabIndex = -1;

    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 48;
    drawWave(canvas, frame);
    cell.appendChild(canvas);

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = i;
    cell.appendChild(idx);

    cell.addEventListener('click', () => {
      const wasActive = cell === activeCell;
      stopScan();
      showFrame(i);
      if (!wasActive) playFrame(frame, cell);
    });

    grid.appendChild(cell);
    currentFrames.push(frame);
    currentCells.push(cell);
  }

  showFrame(0);
  if (wasScanDirection !== 0) {
    startScan(wasScanDirection);
  } else if (wasPlaying) {
    playFrame(currentFrames[0], currentCells[0]);
  }
}

function showFrame(i) {
  if (i < 0 || i >= currentFrames.length) return;
  // Clear the old highlight before selectedIndex moves — doing it after would
  // strip the class off the new cell and leave the old one outlined.
  if (selectedIndex >= 0) currentCells[selectedIndex].classList.remove('selected');
  selectedIndex = i;
  previewLabelEl.textContent = `Waveform #${i}`;
  drawWave(previewCanvasEl, currentFrames[i], true);
  currentCells[i].classList.add('selected');
  currentCells[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  updateHash();
}

function gridColumnCount() {
  if (currentCells.length === 0) return 1;
  const firstTop = currentCells[0].offsetTop;
  for (let i = 1; i < currentCells.length; i++) {
    if (currentCells[i].offsetTop !== firstTop) return i;
  }
  return currentCells.length;
}

document.addEventListener('keydown', (e) => {
  if (currentFrames.length === 0) return;
  if (document.activeElement === filterInput) return;

  if (e.key === ' ' || e.key === 'Enter') {
    if (selectedIndex < 0) return;
    e.preventDefault();
    const cell = currentCells[selectedIndex];
    const wasActive = cell === activeCell;
    stopScan();
    if (!wasActive) playFrame(currentFrames[selectedIndex], cell);
    return;
  }

  const cols = gridColumnCount();
  const from = selectedIndex < 0 ? 0 : selectedIndex;
  let next;
  switch (e.key) {
    case 'ArrowRight': next = Math.min(currentFrames.length - 1, from + 1); break;
    case 'ArrowLeft':  next = Math.max(0, from - 1); break;
    case 'ArrowDown':  next = Math.min(currentFrames.length - 1, from + cols); break;
    case 'ArrowUp':    next = Math.max(0, from - cols); break;
    default: return;
  }
  const wasPlaying = !!activeSource;
  e.preventDefault();
  stopScan();
  showFrame(next);
  if (wasPlaying) playFrame(currentFrames[next], currentCells[next]); // follow selection while playing
});

function startScan(direction) {
  if (currentFrames.length === 0) return;
  scanDirection = direction;
  if (selectedIndex < 0) showFrame(0);
  playFrame(currentFrames[selectedIndex], currentCells[selectedIndex]);
  if (scanTimer) clearInterval(scanTimer);
  scanTimer = setInterval(stepScan, scanIntervalMs);
  updateTransportUI();
  updateHash();
}

function stopScan() {
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  scanDirection = 0;
  stopPlayback();
  updateTransportUI();
  updateHash();
}

function stepScan() {
  const last = currentFrames.length - 1;
  let next = selectedIndex + scanDirection;
  if (next > last) {
    if (scanMode === 'loop') next = 0;
    else if (scanMode === 'bounce') { scanDirection = -1; next = Math.max(0, last - 1); }
    else { stopScan(); return; }
  } else if (next < 0) {
    if (scanMode === 'loop') next = last;
    else if (scanMode === 'bounce') { scanDirection = 1; next = Math.min(last, 1); }
    else { stopScan(); return; }
  }
  showFrame(next);
  playFrame(currentFrames[next], currentCells[next]);
  updateTransportUI();
}

function updateTransportUI() {
  if (!btnForwardEl) return;
  btnForwardEl.classList.toggle('active', scanDirection === 1);
  btnBackwardEl.classList.toggle('active', scanDirection === -1);
  btnLoopEl.classList.toggle('active', scanMode === 'loop');
  btnBounceEl.classList.toggle('active', scanMode === 'bounce');
  speedValueEl.textContent = `${scanIntervalMs} ms/frame`;
}

function drawWave(canvas, samples, thick) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#5fd3c4';
  ctx.lineWidth = thick ? 2 : 1;
  ctx.beginPath();
  const n = samples.length;
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * w;
    const y = h / 2 - (samples[i] / SAMPLE_SCALE) * (h / 2 - 2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function playFrame(frame, cell) {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // A source started while suspended (e.g. autoplay from a shared link,
    // before any gesture) gets silently killed by whatever stopScan()/
    // stopPlayback() call happens to fire next — arrow keys and cell
    // clicks both trigger one as part of their own handling. So instead
    // of racing to replay audio inside the click/keydown handler itself,
    // just re-trigger once the context actually confirms it's running.
    audioCtx.onstatechange = () => {
      if (audioCtx.state === 'running' && activeCell && selectedIndex >= 0) {
        playFrame(currentFrames[selectedIndex], currentCells[selectedIndex]);
      }
    };
  }
  stopPlayback();

  const buffer = audioCtx.createBuffer(1, frame.length, audioCtx.sampleRate);
  const chan = buffer.getChannelData(0);
  for (let i = 0; i < frame.length; i++) chan[i] = frame[i] / SAMPLE_SCALE;

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.3;
  src.connect(gain).connect(audioCtx.destination);
  src.start();

  activeSource = src;
  activeCell = cell;
  cell.classList.add('playing');
}

function stopPlayback() {
  if (activeSource) {
    try { activeSource.stop(); } catch { /* already stopped */ }
    activeSource.disconnect();
    activeSource = null;
  }
  if (activeCell) {
    activeCell.classList.remove('playing');
    activeCell = null;
  }
}

// Minimal RIFF/WAVE parser -> { sampleRate, numChannels, bitsPerSample, samples: Int16Array }
function parseWav(arrayBuffer) {
  const dv = new DataView(arrayBuffer);
  if (dv.getUint32(0, false) !== 0x52494646 /* RIFF */ ||
      dv.getUint32(8, false) !== 0x57415645 /* WAVE */) {
    throw new Error('not a RIFF/WAVE file');
  }
  let offset = 12;
  let fmt = null, dataOffset = null, dataLength = null;
  while (offset + 8 <= dv.byteLength) {
    const id = String.fromCharCode(
      dv.getUint8(offset), dv.getUint8(offset + 1),
      dv.getUint8(offset + 2), dv.getUint8(offset + 3));
    const size = dv.getUint32(offset + 4, true);
    const body = offset + 8;
    if (id === 'fmt ') {
      fmt = {
        audioFormat: dv.getUint16(body, true),
        numChannels: dv.getUint16(body + 2, true),
        sampleRate: dv.getUint32(body + 4, true),
        bitsPerSample: dv.getUint16(body + 14, true),
      };
    } else if (id === 'data') {
      dataOffset = body;
      dataLength = size;
    }
    offset = body + size + (size % 2); // chunks are word-aligned
  }
  if (!fmt || dataOffset == null) throw new Error('missing fmt/data chunk');
  if (fmt.bitsPerSample !== 16) throw new Error(`unsupported bit depth ${fmt.bitsPerSample}`);

  const sampleCount = Math.floor(dataLength / 2);
  const samples = new Int16Array(arrayBuffer, dataOffset, sampleCount);

  return {
    sampleRate: fmt.sampleRate,
    numChannels: fmt.numChannels,
    bitsPerSample: fmt.bitsPerSample,
    samples,
  };
}
